<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Prasanth S — Cybersecurity Engineer</title>
  <desc id="desc">A dark 3D cyber security command-center banner with a neon green shield and cyan network grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070c"/><stop offset=".55" stop-color="#07151b"/><stop offset="1" stop-color="#020504"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00ff88"/><stop offset="1" stop-color="#00b8ff"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d20"/><stop offset=".5" stop-color="#0c5f55"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse" patternTransform="skewY(-18)"><path d="M55 0H0V55" fill="none" stroke="#00d9a520" stroke-width="1"/></pattern>
  </defs>
  <rect width="1400" height="430" fill="url(#bg)" rx="24"/>
  <ellipse cx="1070" cy="205" rx="330" ry="220" fill="#00ff8820" filter="url(#blur)"/>
  <path d="M0 325 230 270 520 305 810 232 1080 275 1400 185V430H0Z" fill="url(#grid)" opacity=".92"/>
  <path d="M0 325 230 270 520 305 810 232 1080 275 1400 185" fill="none" stroke="#00d9a050" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="86" y="88" fill="#7fffd4" font-size="17" letter-spacing="5">PRASANTH.SELVA // SECURITY LAB</text>
    <text x="82" y="175" fill="#f3fff9" font-size="64" font-weight="700" letter-spacing="-2">Cybersecurity</text>
    <text x="84" y="244" fill="#00ff88" font-size="64" font-weight="700" letter-spacing="-2">Engineer.</text>
    <text x="87" y="286" fill="#99b9b1" font-size="18">VAPT · WEB APP SECURITY · BUG BOUNTY · SOC / DETECTION</text>
    <text x="87" y="342" fill="#5ef2c0" font-size="14" letter-spacing="2">AUTHORIZED RESEARCH  /  BUILDING USEFUL DEFENSES</text>
    <text x="87" y="380" fill="#51746d" font-size="13">COIMBATORE, INDIA  •  OPEN TO SECURITY ENGINEERING ROLES</text>
  </g>
  <g transform="translate(1090 214)">
    <circle r="136" fill="#00ff8810" stroke="#00ff8840" stroke-width="1"/>
    <circle r="105" fill="none" stroke="#00cfff55" stroke-width="1" stroke-dasharray="5 10"/>
    <path d="M0-86 78-55 66 37 0 91-66 37-78-55Z" fill="url(#shield)" stroke="#a2ffe5" stroke-width="2"/>
    <path d="M0-59 52-38 44 26 0 62-44 26-52-38Z" fill="#031014" stroke="#00ff88" stroke-width="2"/>
    <path d="M-24 0  -5 20 31-24" fill="none" stroke="#00ff88" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-126-19H-91M91 38H129M-29-129V-94M42 91V126" stroke="#00d9ff" stroke-width="3"/>
    <circle cx="-126" cy="-19" r="4" fill="#00d9ff"/><circle cx="129" cy="38" r="4" fill="#00ff88"/>
  </g>
  <path d="M45 26H1355" stroke="#00ff88" stroke-opacity=".35"/><path d="M45 402H1355" stroke="#00b8ff" stroke-opacity=".25"/>
</svg>
